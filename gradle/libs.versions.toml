# -----------------------------------------------------------------------------
# VERSIONS – Centralized version catalog
#           Only versions that are required globally or shared across multiple dependencies
#           are declared here. For single-use cases, inline values are preferred.
# -----------------------------------------------------------------------------
[versions]
coilNetworkOkhttp = "3.3.0"
kotlin = "2.4.10"          # Kotlin language version
agp = "9.4.0"              # Android Gradle Plugin
material_icons = "1.7.8"   # Jetpack Compose Material Icons


# ==================================PLUGINS====================================
[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # JetBrains Compose Compiler
android-application = { id = "com.android.application", version.ref = "agp" }             # For app modules
android-library = { id = "com.android.library", version.ref = "agp" }                     # For library modules
maven-publish = { id = "maven-publish", version = "0.0.0" }                               # Publishing plugin (placeholder)


# ===============================  LIBRARIES  =================================
[libraries]

# -----------------------------------------------------------------------------
# Compose
# -----------------------------------------------------------------------------
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-animation =  { group = "androidx.compose.animation", name = "animation" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
androidx-material-ripple  = { group = "androidx.compose.material", name = "material-ripple" }


# -----------------------------------------------------------------------------
# LIBRARIES : Material Icons - Vector icons for Compose UI.
# -----------------------------------------------------------------------------
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "material_icons" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material_icons" }


# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------
androidx-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.2.1" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.6.2" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
chrisbanes-haze = { module = "dev.chrisbanes.haze:haze", version = "1.7.2" }
androidx-window = { group = "androidx.window", name = "window", version = "1.5.1" }